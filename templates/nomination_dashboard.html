{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
    {% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nomination Dashboard{% endblock %}</title>
    <style>
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        a.button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .content {
            margin-top: 20px;
            display: none;
        }
        .content.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nomination Dashboard</h1>
        {% if session.access_level == 'full_access' %}
        <a href="{{ url_for('select_category') }}" class="button">Add Nomination</a>
        <a href="{{ url_for('approval_page') }}" class="button">Approval Page</a>
        <a href="{{ url_for('add_team_member') }}" class="button">Add Team Member</a>
        <a href="{{ url_for('view_team_members') }}" class="button">View Team Members</a>
        {% endif %}
        <a href="{{ url_for('view_nominees') }}" class="button">View Nominees</a>
        
        
    </div>
</body>
{% endblock %}
</html>
