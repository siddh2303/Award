
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomination Dashboard</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        a.button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .content {
            margin-top: 20px;
            display: none;
        }
        .content.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nomination Dashboard</h1>
        {% if session.access_level == 'full_access' %}
        <a href="{{ url_for('new_nomination') }}" class="button">Award Nomination</a>
        {% endif %}
        <a href="{{ url_for('view_nominees') }}" class="button">View Nominees</a>
        
        
    </div>
    
    
</body>
</html>
