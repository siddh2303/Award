
{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
    {% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Extend Deadline{% endblock %}</title>
</head>
<body>
    <div class="container">
        <h1>Extend Deadline for {{ category.name }}</h1>
        <form method="POST">
            <label for="new_end_date">New End Date:</label>
            <input type="date" name="new_end_date" id="new_end_date" required>
            <button type="submit">Extend Deadline</button>
        </form>
    </div>    
</body>
{% endblock %}
</html>
