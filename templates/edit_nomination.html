
{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
    {% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Edit Nomination{% endblock %}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <button class="btn btn-secondary back-button" onclick="history.back()">Back</button>
    <div class="container">
        <h2>Edit Nomination</h2>
        <form method="POST" action="{{ url_for('edit_nomination', nomination_id=nomination.id) }}">
            
            <div class="form-group">
                <label for="nominee_name" class="form-label">Nominee Name</label>
                <input type="text" class="form-control" name="nominee_name" value="{{ nomination.nominee_name }}" required>
            </div>
            <div class="form-group">
                <label for="nominee_global_id" class="form-label">Nominee Global ID</label>
                <input type="text" class="form-control" name="nominee_global_id" value="{{ nomination.nominee_global_id }}" required>
            </div>
            <div class="form-group">
                <label for="nominee_email" class="form-label">Nominee Email</label>
                <input type="email" class="form-control" name="nominee_email" value="{{ nomination.nominee_email }}" required>
            </div>
            <div class="form-group">
                <label for="team_member_name" class="form-label">Team Member Name:</label>
                <select name="team_member_name" class="form-control" required>
                    {% for member in team_members %}
                        <option value="{{ member.name }}" {% if member.name == nomination.team_member_name %}selected{% endif %}>
                            {{ member.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="category_id" class="form-label">Award Category</label>
                
                {% for category in categories %}
                    {% if category.id == nomination.category_id %}
                        <input type="text" class="form-control" id="category_id" name="category_id" value="{{ category.name }} ({{ category.start_date.strftime('%d-%B-%Y') }} - {{ category.end_date.strftime('%d-%B-%Y') }})" disabled>
                        <input type="hidden" id="category_id" name="category_id" value="{{ category.id }}">
                    {% endif %}
                {% endfor %}
            </div>
            <div class="form-group">
                <label for="award_id" class="form-label">Award Name</label>
                <select id="award_id" name="award_id" class="form-control" required>
                    <option value="">Select an Award</option>
                    {% for award in awards %}
                        <option value="{{ award.name }}" {% if award.name == nomination.award_name %}selected{% endif %}>{{ award.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="comments" class="form-label">Comments</label>
                <textarea name="comments" class="form-control" required>{{ nomination.comments }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Nomination</button>
        </form>
    </div>
</body>
{% endblock %}
</html>
