{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
    {% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Category Dashboard{% endblock %}</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .buttons {
            margin-bottom: 20px;
        }
        a.button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .content {
            margin-top: 20px;
            display: none;
        }
        .content.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nomination Dashboard</h1>
        <div class="buttons">
            {% if session.access_level == 'full_access' %}
                <a href="{{ url_for('category') }}" class="button">Create a New Category</a>
            {% endif %}
            <a href="{{ url_for('view_categories') }}" class="button">View Categories</a>
        </div>
    </div>  
</body>
{% endblock %}
</html>
