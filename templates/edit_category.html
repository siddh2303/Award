{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
    {% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Edit Category{% endblock %}</title>

</head>
<body>
    <div class="container">
        <h1>Edit Category</h1>
        <form method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ category.name }}" required>
            <br>
            <label for="start_date">Start Date:</label>
            <input type="date" id="start_date" name="start_date" value="{{ category.start_date.strftime('%Y-%m-%d') }}" required>
            <br>
            <label for="end_date">End Date:</label>
            <input type="date" id="end_date" name="end_date" value="{{ category.end_date.strftime('%Y-%m-%d') }}" required>
            <br>
            <button type="submit">Save Changes</button>
        </form>
        <p><a href="{{ url_for('view_categories') }}">Back to Categories</a></p>
    </div>
</body>
{% endblock %}
</html>
